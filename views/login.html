<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoply | Login</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">
  <main class="login-wrapper">
    <a class="brand" href="/">Shoply</a>
    <section class="login-card">
      <p class="eyebrow">Bem-vindo de volta</p>
      <h1>Entre na sua conta</h1>
      <p class="muted-text">Acesse seus pedidos e acompanhe suas escolhas.</p>

      <form class="login-form" action="/login" method="post">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="off" placeholder="voce@exemplo.com" required>

        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="off" placeholder="Digite sua senha" required>

        <button class="button" type="submit" action="/Dashboard">Entrar</button>
      </form>
    </section>
  </main>
</body>
</html>
